<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Inventory</title>
<style>
:root{--bg:#f4f0ea;--panel:#fffdfa;--ink:#1d1b20;--mute:#756f67;--line:#ddd5cb;--accent:#c98e91;--accent-ink:#fff;--ok:#58705b;--low:#a57a48;--out:#a64f5b;--okbg:#e8eee5;--lowbg:#f3e5d2;--outbg:#f2dcdf}
body{background:linear-gradient(135deg,#f7f3ee 0%,#efe7df 100%);display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
.site-header{position:sticky;top:0;z-index:20;background:rgba(255,253,250,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
.header-inner{width:100%;height:72px;padding:0 clamp(20px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;letter-spacing:-.5px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:18px}
nav{width:auto;height:auto;padding:0;border:0;position:static;display:flex;align-items:center;gap:4px}
nav h1{display:none}
nav button{width:auto;padding:9px 12px}
nav button.on{box-shadow:0 5px 16px rgba(169,107,112,.18)}
.panel,.stat{box-shadow:0 8px 24px rgba(73,61,49,.055)}
.hero{min-height:360px;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:28px;border:1px solid var(--line);border-radius:16px;padding:38px 42px;margin-bottom:16px;background:var(--panel);box-shadow:0 12px 34px rgba(73,61,49,.08);overflow:hidden}
.hero-copy h2{font-size:44px;line-height:1.08;letter-spacing:-1.8px;margin:10px 0 16px}
.hero-copy p{max-width:520px;color:var(--mute);font-size:16px;margin:0 0 22px}
.eyebrow{display:inline-block;padding:5px 10px;border-radius:99px;background:var(--lowbg);color:var(--low);font-size:12px;font-weight:700}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.carousel{position:relative}
.carousel-slides{position:relative;height:280px}
.carousel-slide{position:absolute;inset:0;opacity:0;transform:translateX(12px);transition:.35s ease;pointer-events:none}
.carousel-slide.active{opacity:1;transform:none;pointer-events:auto}
.slide-card{height:280px;border-radius:14px;padding:28px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative}
.slide-card.one{background:linear-gradient(145deg,#eadbd2,#c98e91)}
.slide-card.two{background:linear-gradient(145deg,#efe5dc,#b9c2ad)}
.slide-card.three{background:linear-gradient(145deg,#e8d6d8,#dfb9b9)}
.slide-card:before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.38);right:-70px;top:-90px}
.slide-card strong{position:relative;font-family:Georgia,serif;font-size:42px;line-height:.95;max-width:250px}
.carousel-dots{position:absolute;left:16px;bottom:14px;display:flex;gap:6px;z-index:3}
.carousel-dot{width:7px;height:7px;border:0;border-radius:99px;padding:0;background:rgba(255,255,255,.65)}
.carousel-dot.active{width:22px;background:#fff}
.hero-art{height:280px;border-radius:14px;background:linear-gradient(145deg,#eadbd2,#c98e91);display:flex;align-items:center;justify-content:center;position:relative}
.hero-art .art-card{width:62%;height:72%;border-radius:12px;background:#fffdfa;box-shadow:0 18px 38px rgba(73,61,49,.16);padding:22px;transform:rotate(-4deg)}
.hero-art .art-line{height:10px;border-radius:8px;background:var(--line);margin:12px 0}
.hero-art .art-line.accent{width:55%;background:var(--accent)}
.feature-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.feature{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 24px rgba(73,61,49,.055)}
.feature b{display:block;font-size:18px;margin-bottom:4px}
.feature span{color:var(--mute)}
.about-section{display:grid;grid-template-columns:.8fr 1.2fr;gap:32px;align-items:center;padding:32px;margin:26px 0;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 24px rgba(73,61,49,.055)}
.about-copy h2{font-size:30px;line-height:1.15;letter-spacing:-.7px;margin:12px 0}
.about-copy p{color:var(--mute);margin:0}
.about-points{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.about-point{padding:16px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.about-point b{display:block;margin-bottom:5px}
.about-point span{color:var(--mute);font-size:14px}
.site-footer{border-top:1px solid var(--line);background:rgba(255,253,250,.88)}
.site-footer{background:#25211f;color:#fffaf4;border-top:4px solid #c98e91}
.footer-inner{width:100%;padding:36px clamp(20px,5vw,72px) 18px}
.footer-main{display:grid;grid-template-columns:2fr 1fr 1fr;gap:36px;padding-bottom:28px}
.footer-brand{font-size:21px;font-weight:800;margin-bottom:8px}
.footer-description{max-width:360px;color:#e3ddd6;margin:0}
.footer-title{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:#f0b9ad;margin:4px 0 12px}
.footer-links{display:grid;gap:8px}
.footer-link{justify-self:start;padding:0;border:0;background:none;color:#f8f3eb;font:inherit;cursor:pointer}
.footer-link:hover{text-decoration:underline}
.footer-bottom{border-top:1px solid rgba(255,255,255,.24);padding-top:16px;display:flex;justify-content:space-between;gap:16px;color:#e3ddd6;font-size:13px}
input,select{border-color:#d8cfc3}
input:focus-visible,select:focus-visible,button:focus-visible{outline-color:#b8797d}
button.btn{box-shadow:0 4px 12px rgba(169,107,112,.12)}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh}
nav{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh}
nav h1{font-size:18px;margin:0 8px 18px}
nav button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:9px 12px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--accent);color:var(--accent-ink)}
nav button:hover:not(.on){background:var(--bg)}
main{flex:1;padding:24px clamp(20px,5vw,72px);max-width:none;width:100%}
h2{margin:0 0 16px;font-size:22px}
h3{margin:22px 0 8px;font-size:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mute);font-weight:600}
.wrap{overflow-x:auto}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
button.btn{font:inherit;padding:8px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.btn.alt{background:none;color:var(--accent)}
button.btn.del{background:none;border-color:var(--out);color:var(--out)}
button.btn.sm{padding:4px 9px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.OK{background:var(--okbg);color:var(--ok)}.LOW{background:var(--lowbg);color:var(--low)}.OUT{background:var(--outbg);color:var(--out)}
.empty{color:var(--mute);padding:14px 4px}
#toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;display:none;max-width:320px}
#toast.err{background:var(--out);color:#fff}
.bar{height:8px;background:var(--accent);border-radius:4px}

<header class="site-header">
  <div class="header-inner">

</nav>
</div>
</header>
<main id="view"></main>
<footer class="site-footer">
  <div class="footer-inner">
    <div class="footer-main">
      <div class="footer-about">
        <div class="footer-brand">Smart Inventory</div>
        <p class="footer-description">A simpler way to track products, record sales and keep your stock ready for what comes next.</p>
      </div>
      <div>
        <h2 class="footer-title">Explore</h2>
        <div class="footer-links">
          <button class="footer-link" data-go="home">Home</button>
          <button class="footer-link" data-go="about">About</button>
          <button class="footer-link" data-go="overview">Dashboard</button>
          <button class="footer-link" data-go="products">Inventory</button>
        </div>
      </div>
      <div>
        <h2 class="footer-title">Inventory</h2>
        <div class="footer-links">
          <button class="footer-link" data-go="sell">Record a sale</button>
          <button class="footer-link" data-go="reorder">Restock suggestions</button>
          <button class="footer-link" data-go="sales">Sales history</button>
        </div>
      </div>
    </div>
    <div class="footer-bottom"><span>© 2026 Smart Inventory</span><span>Stock clarity for every day</span></div>
  </div>
</footer>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const money = n => '₹' + Number(n).toLocaleString('en-IN', {maximumFractionDigits: 2});
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function productImage(product) {
  const name = String(product.name || '').toLowerCase();
  const category = String(product.category || '').toLowerCase();
  let photo = 'notebook.jpg';
  if (/mouse/.test(name)) photo = 'mouse.jpg';
  else if (/keyboard/.test(name)) photo = 'keyboard.jpg';
  else if (/headphone/.test(name)) photo = 'headphones.jpg';
  else if (/calculator/.test(name)) photo = 'calculator.jpg';
  else if (/cable|charger|pendrive|usb hub/.test(name)) photo = 'cable.png';
  else if (/book/.test(name) || category === 'books') photo = 'books.jpg';
  else if (/pen|pencil|highlighter/.test(name)) photo = 'pen.jpg';
  return `<img class="product-visual" src="/images/${photo}" alt="" loading="lazy" decoding="async">`;
}
function productIdentity(product) {
  return `<span class="product-name">${productImage(product)}<span>${esc(product.name)}</span></span>`;
}
let tab = 'home', products = [], productsLoaded = false;
let carouselTimer, renderVersion = 0, cacheVersion = 0;
const apiCache = new Map(), pendingApi = new Map();

function cachedApi(path) {
  if (apiCache.has(path)) return Promise.resolve(apiCache.get(path));
  if (!pendingApi.has(path)) {
    const version = cacheVersion;
    const request = api(path).then(data => {
      if (version === cacheVersion) apiCache.set(path, data);
      return data;
    }).finally(() => {
      if (pendingApi.get(path) === request) pendingApi.delete(path);
    });
    pendingApi.set(path, request);
  }
  return pendingApi.get(path);
}
function invalidateApiCache() {
  cacheVersion++;
  apiCache.clear();
  pendingApi.clear();
}

async function api(path, method = 'GET', body) {
  const res = await fetch('/api' + path, {method, headers: {'Content-Type': 'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = err ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 3200);
}
async function act(fn, okMsg) {
  try {
    await fn();
    invalidateApiCache();
    products = await cachedApi('/products');
    productsLoaded = true;
    if (okMsg) toast(okMsg);
    render();
  } catch (e) { toast(e.message, true); }
}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tab = b.dataset.t; b.setAttribute('aria-current', 'page'); render();
  document.querySelectorAll('nav button').forEach(x => { if (x !== b) x.removeAttribute('aria-current'); });
});
document.addEventListener('click', e => {
  const link = e.target.closest('[data-go]');
  if (link) goTab(link.dataset.go);
});

function render() {
  clearInterval(carouselTimer);
  const version = ++renderVersion;
  const view = $('#view');
  view.classList.remove('page-enter');
  void view.offsetWidth;
  view.classList.add('page-enter');
  if (!productsLoaded) {
    view.innerHTML = '<div class="empty-state">Loading your inventory…</div>';
    return;
  }
  try {
    const page = ({home, about, overview, products: viewProducts, sell, reorder, sales}[tab] || home)();
    if (page && typeof page.catch === 'function') page.catch(e => {
      if (version === renderVersion) toast(e.message, true);
    });
  } catch (e) { toast(e.message, true); }
}

function preloadNavigationData() {
  const paths = ['/report', '/suggestions', '/requests', '/sales'];
  void Promise.allSettled(paths.map(path => cachedApi(path))).then(results => {
    results.forEach((result, index) => {
      if (result.status === 'rejected') console.warn(`Could not preload ${paths[index]}:`, result.reason);
    });
  });
}
async function initialize() {
  try {
    products = await cachedApi('/products');
    productsLoaded = true;
    render();
    preloadNavigationData();
  } catch (e) { toast(e.message, true); }
}

function home() {
  const lowCount = products.filter(p => p.quantity <= p.reorderLevel).length;
  const totalStock = products.reduce((sum, p) => sum + p.quantity, 0);
  $('#view').innerHTML = `<section class="hero">
    <div class="hero-copy">
      <span class="eyebrow">Smart Inventory</span>
      <h2>Stock clarity,<br>every day.</h2>
      <p>Manage products, record sales and stay ahead of restocking with clear, simple inventory insights.</p>
      <div class="hero-actions">
        <button class="btn" id="homeProducts">View products</button>
        <button class="btn alt" id="homeOverview">Open overview</button>
      </div>
    </div>
    <div class="carousel" aria-label="Inventory highlights">
      <div class="carousel-slides">
        <div class="carousel-slide active"><div class="slide-card one"><span class="slide-art">${productImage({name:'Notebook',category:'Stationery'})}</span><span class="eyebrow">Today's stock</span><strong>Know what is in</strong></div></div>
        <div class="carousel-slide"><div class="slide-card two"><span class="slide-art">${productImage({name:'Wireless Mouse',category:'Electronics'})}</span><span class="eyebrow">Sales</span><strong>Turn activity into insight</strong></div></div>
        <div class="carousel-slide"><div class="slide-card three"><span class="slide-art">${productImage({name:'Java Programming Book',category:'Books'})}</span><span class="eyebrow">Restock</span><strong>Stay ahead of demand</strong></div></div>
      </div>
      <div class="carousel-dots">
        <button class="carousel-dot active" aria-label="Slide 1"></button>
        <button class="carousel-dot" aria-label="Slide 2"></button>
        <button class="carousel-dot" aria-label="Slide 3"></button>
      </div>
    </div>
  </section>
  <div class="feature-grid">
    <div class="feature"><b>${products.length} products</b><span>Currently tracked in inventory</span></div>
    <div class="feature"><b>${totalStock} units</b><span>Total stock available now</span></div>
    <div class="feature"><b>${lowCount} alerts</b><span>Low or out-of-stock items</span></div>
  </div>`;
  $('#view').insertAdjacentHTML('beforeend', `<section class="launch-grid" aria-label="Quick actions">
    <button class="launch-card" data-go="overview"><span class="launch-icon">▦</span><strong>Open dashboard</strong><span>See stock health, performance and category insights.</span></button>
    <button class="launch-card" data-go="products"><span class="launch-icon">▤</span><strong>Manage inventory</strong><span>Search products, update quantities or add new items.</span></button>
    <button class="launch-card" data-go="reorder"><span class="launch-icon">↗</span><strong>Plan a restock</strong><span>Review demand-based suggestions and pending requests.</span></button>
  </section>`);
  $('#homeProducts').onclick = () => goTab('products');
  $('#homeOverview').onclick = () => goTab('overview');
  const slides = [...document.querySelectorAll('.carousel-slide')];
  const dots = [...document.querySelectorAll('.carousel-dot')];
  let current = 0;
  clearInterval(carouselTimer);
  const showSlide = index => {
    current = (index + slides.length) % slides.length;
    slides.forEach((slide, i) => slide.classList.toggle('active', i === current));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
  };
  dots.forEach((dot, i) => dot.onclick = () => showSlide(i));
  carouselTimer = setInterval(() => showSlide(current + 1), 4000);
}

}

function goTab(name) {
  tab = name;
  document.querySelectorAll('nav button').forEach(b => {
    const active = b.dataset.t === name;
    b.classList.toggle('on', active);
    if (active) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

async function overview() {
  const version = renderVersion;
  $('#view').innerHTML = `<section class="page-heading"><div><span class="eyebrow">Inventory dashboard</span><h2>Your stock, at a glance.</h2><p>Loading your latest stock and sales details…</p></div></section><div class="empty-state">Preparing dashboard insights…</div>`;
  const [r, suggestions] = await Promise.all([cachedApi('/report'), cachedApi('/suggestions')]);
  if (version !== renderVersion || tab !== 'overview') return;
  const max = Math.max(1, ...r.topSellers.map(t => t.units));
  const healthy = suggestions.filter(s => s.status === 'OK').length;
  const low = suggestions.filter(s => s.status === 'LOW').length;
  const out = suggestions.filter(s => s.status === 'OUT').length;
  $('#view').innerHTML = `<section class="dashboard-hero">
    <div><span class="eyebrow">Inventory dashboard</span><h2>Your stock, at a glance.</h2>
    <p>Monitor inventory health, sales performance and the next actions that keep your shelves ready.</p></div>
    <div class="page-actions"><button class="btn" data-go="products">Manage inventory</button><button class="btn alt" data-go="sell">Record a sale</button></div>
  </section>
  <div class="stats">
    <div class="stat"><b>${r.totalProducts}</b><span>Products</span></div>
    <div class="stat"><b>${money(r.stockValue)}</b><span>Stock value</span></div>
    <div class="stat"><b>${r.lowStock}</b><span>Items low or out of stock</span></div>
    <div class="stat"><b>${money(r.revenue)}</b><span>Total revenue (${r.unitsSold} units)</span></div>
  </div>
  <section class="panel">
    <div class="page-heading"><div><span class="eyebrow">Stock health</span><h2>Know where to focus</h2><p>A quick status check across your current catalog.</p></div>
    <button class="btn alt" data-go="reorder">View restock suggestions</button></div>
    <div class="health-grid">
      <div class="health-card ok"><strong>${healthy}</strong><span>Healthy items</span></div>
      <div class="health-card low"><strong>${low}</strong><span>Running low</span></div>
      <div class="health-card out"><strong>${out}</strong><span>Out of stock</span></div>
    </div>
  </section>
  <div class="dashboard-columns">
    <section class="panel"><span class="eyebrow">Sales performance</span><h2>Top sellers</h2>
    ${r.topSellers.length ? r.topSellers.map(t => `<div class="rank-row"><div class="rank-label"><span>${productIdentity(products.find(p => p.name === t.name) || {name:t.name})}</span><span>${t.units} units · ${money(t.revenue)}</span></div><div class="bar" style="width:${t.units / max * 100}%"></div></div>`).join('') : '<div class="empty-state">No sales yet. Record a sale to see your top sellers here.</div>'}
    </section>
    <section class="panel"><span class="eyebrow">Catalog mix</span><h2>Products by category</h2>
    ${Object.keys(r.byCategory).length ? `<div class="category-list">${Object.entries(r.byCategory).map(([k, v]) => `<span class="category-chip">${esc(k)} <b>${v}</b></span>`).join('')}</div>` : '<div class="empty-state">Add products to see your category mix.</div>'}
    <div class="page-actions" style="margin-top:18px"><button class="btn alt" data-go="products">Browse inventory</button></div>
    </section>
  </div>`;
}

let q = '', sort = '';
function viewProducts() {
  $('#view').innerHTML = `<section class="page-heading">
    <div><span class="eyebrow">Inventory</span><h2>Your product catalog</h2><p>Search your stock, update quantities and keep product details in one place.</p></div>
    <div class="page-actions"><button class="btn alt" data-go="overview">Back to dashboard</button></div>
  </section>
  <div class="panel"><div class="row">
    <input id="q" placeholder="Search name or category" value="${esc(q)}">
    <select id="sort"><option value="">Sort: newest last</option><option value="name">Name</option><option value="quantity">Quantity</option><option value="price">Price</option></select>
  </div><div class="wrap table-panel" id="plist"></div></div>
  <div class="panel form-card"><span class="eyebrow">Expand your catalog</span><h3>Add a product</h3>
  <p>Enter the basic details to start tracking a new item.</p>
  <div class="row">
    <input id="n" placeholder="Name"><input id="c" placeholder="Category">
    <select id="t"><option value="GENERAL">General</option><option value="PERISHABLE">Perishable (3-day lead time)</option><option value="ELECTRONIC">Electronic (14-day lead time)</option></select>
  </div><div class="row">
    <input id="p" type="number" min="0" step="0.01" placeholder="Price"><input id="qt" type="number" min="0" placeholder="Opening stock"><input id="rl" type="number" min="0" placeholder="Reorder level">
    <button class="btn" id="add">Add product</button>
  </div></div>`;
  $('#sort').value = sort;
  const load = () => {
    const query = q.trim().toLowerCase();
    const list = products.filter(p => !query || p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
    if (sort === 'name') list.sort((a, b) => a.name.toLowerCase().localeCompare(b.name.toLowerCase()));
    else if (sort === 'quantity') list.sort((a, b) => a.quantity - b.quantity);
    else if (sort === 'price') list.sort((a, b) => a.price - b.price);
    $('#plist').innerHTML = list.length ? `<table><tr><th>Name</th><th>Category</th><th>Type</th><th>Price</th><th>Stock</th><th>Reorder at</th><th></th></tr>
    ${list.map(p => `<tr><td>${productIdentity(p)}</td><td>${esc(p.category)}</td><td>${p.type.toLowerCase()}</td><td>${money(p.price)}</td><td>${p.quantity}</td><td>${p.reorderLevel}</td>
    <td><button class="btn sm alt" data-in="${p.id}">Add stock</button> <button class="btn sm del" data-del="${p.id}">Delete</button></td></tr>`).join('')}</table>` : '<div class="empty">No products match. Clear the search or add a product below.</div>';
    document.querySelectorAll('[data-in]').forEach(b => b.onclick = () => {
      const n = parseInt(prompt('How many units arrived?', '10'));
      if (n > 0) act(() => api(`/products/${b.dataset.in}/stock`, 'POST', {quantity: n}), 'Stock added');
    });
    document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
      if (confirm('Delete this product and its sales history?')) act(() => api('/products/' + b.dataset.del, 'DELETE'), 'Product deleted');
    });
  };
  $('#q').oninput = e => { q = e.target.value; load(); };
  $('#sort').onchange = e => { sort = e.target.value; load(); };
  $('#add').onclick = () => act(() => api('/products', 'POST', {
    name: $('#n').value, category: $('#c').value, type: $('#t').value,
    price: parseFloat($('#p').value) || 0, quantity: parseInt($('#qt').value) || 0, reorderLevel: parseInt($('#rl').value) || 0}), 'Product added');
  load();
}

function sell() {
  $('#view').innerHTML = `<section class="page-heading">
    <div><span class="eyebrow">Sales</span><h2>Record a sale</h2><p>Choose an item and quantity. Your available inventory updates when the sale is saved.</p></div>
    <div class="page-actions"><button class="btn alt" data-go="overview">Open dashboard</button></div>
  </section>
  <section class="panel form-card">
    <h3>Sale details</h3><p>Products with no stock cannot be selected.</p>
    ${products.length ? `<div class="row">
      <select id="sp" aria-label="Product">${products.map(p => `<option value="${p.id}" ${p.quantity < 1 ? 'disabled' : ''}>${esc(p.name)} (${p.quantity} in stock)</option>`).join('')}</select>
      <input id="sq" type="number" min="1" value="1" style="width:110px" aria-label="Quantity">
      <button class="btn" id="go">Record sale</button></div>
      <div class="sale-preview" id="salePreview" aria-live="polite"></div>` : `<div class="empty-state">Your catalog is empty. Add a product before recording a sale.</div>
      <div class="page-actions" style="margin-top:16px"><button class="btn" data-go="products">Add your first product</button></div>`}
  </section>`;
  if (!products.length) return;
  const updatePreview = () => {
    const product = products.find(p => p.id === +$('#sp').value);
    const quantity = +$('#sq').value;
    const valid = product && quantity >= 1 && quantity <= product.quantity;
    $('#salePreview').innerHTML = product ? `<div class="sale-item">${productImage(product)}<div><strong>${esc(product.name)}</strong><span>${product.quantity} units currently available · ${money(product.price)} per unit</span></div></div><div><span>Sale total</span><strong>${money(product.price * (quantity || 0))}</strong></div>` : '<span>No products are currently in stock.</span>';
    $('#go').disabled = !valid;
  };
  $('#sp').onchange = updatePreview;
  $('#sq').oninput = updatePreview;
  updatePreview();
  $('#go').onclick = () => act(() => api('/sales', 'POST', {productId: +$('#sp').value, quantity: +$('#sq').value}), 'Sale recorded');
}

async function reorder() {
  const version = renderVersion;
  $('#view').innerHTML = `<section class="page-heading"><div><span class="eyebrow">Restock planning</span><h2>Stay ahead of demand.</h2><p>Suggestions use recent sales, supplier lead time and a seven-day buffer to help you plan orders.</p></div></section><div class="empty-state">Loading restock suggestions…</div>`;
  const [sug, reqs] = await Promise.all([cachedApi('/suggestions'), cachedApi('/requests')]);
  if (version !== renderVersion || tab !== 'reorder') return;
  const low = sug.filter(s => s.status === 'LOW').length;
  const out = sug.filter(s => s.status === 'OUT').length;
  $('#view').innerHTML = `<section class="page-heading">
    <div><span class="eyebrow">Restock planning</span><h2>Stay ahead of demand.</h2><p>Suggestions use recent sales, supplier lead time and a seven-day buffer to help you plan orders.</p></div>
    <div class="page-actions"><button class="btn alt" data-go="overview">Open dashboard</button></div>
  </section>
  <div class="status-summary"><span class="tag LOW">${low} running low</span><span class="tag OUT">${out} out of stock</span><span class="tag OK">${reqs.length} pending requests</span></div>
  <div class="panel table-panel wrap"><table><tr><th>Product</th><th>Status</th><th>In stock</th><th>Avg sold / day</th><th>Days left</th><th>Suggested order</th><th></th></tr>
  ${sug.length ? sug.map(s => `<tr><td>${productIdentity(products.find(p => p.id === s.productId) || {name:s.name})}</td><td><span class="tag ${s.status}">${s.status === 'OUT' ? 'Out of stock' : s.status === 'LOW' ? 'Low' : 'OK'}</span></td>
  <td>${s.quantity}</td><td>${s.avgDailySales}</td><td>${s.daysLeft >= 999 ? '–' : s.daysLeft}</td><td>${s.suggestedOrder || '–'}</td>
  <td>${s.suggestedOrder ? `<button class="btn sm" data-rq="${s.productId}" data-n="${s.suggestedOrder}">Queue request</button>` : ''}</td></tr>`).join('') : '<tr><td colspan="7"><div class="empty-state">Add products to get restock suggestions.</div></td></tr>'}</table></div>
  <h3>Pending requests <span style="color:var(--mute);font-weight:400">(oldest first)</span></h3>
  <div class="panel">${reqs.length ? `<table><tr><th>#</th><th>Product</th><th>Quantity</th><th>Requested</th></tr>
  ${reqs.map(r => `<tr><td>${r.id}</td><td>${productIdentity(products.find(p => p.name === r.productName) || {name:r.productName})}</td><td>${r.quantity}</td><td>${r.requestedAt}</td></tr>`).join('')}</table>
  <div class="row" style="margin:12px 0 0"><button class="btn" id="ful">Mark oldest request as received</button></div>` : '<div class="empty">Nothing pending. Queue a request from the table above.</div>'}</div>`;
  document.querySelectorAll('[data-rq]').forEach(b => b.onclick = () =>
    act(() => api('/requests', 'POST', {productId: +b.dataset.rq, quantity: +b.dataset.n}), 'Request queued'));
  const f = $('#ful'); if (f) f.onclick = () => act(() => api('/requests/fulfil', 'POST'), 'Stock received and added');
}

async function sales() {
  const version = renderVersion;
  $('#view').innerHTML = `<section class="page-heading"><div><span class="eyebrow">Sales activity</span><h2>Recent transactions</h2><p>Loading your latest sales…</p></div></section><div class="empty-state">Loading sales history…</div>`;
  const list = await cachedApi('/sales');
  if (version !== renderVersion || tab !== 'sales') return;
  const units = list.reduce((sum, sale) => sum + sale.quantity, 0);
  const revenue = list.reduce((sum, sale) => sum + sale.total, 0);
  $('#view').innerHTML = `<section class="page-heading">
    <div><span class="eyebrow">Sales activity</span><h2>Recent transactions</h2><p>Review recorded sales and the units and revenue they represent.</p></div>
    <div class="page-actions"><button class="btn" data-go="sell">Record a sale</button><button class="btn alt" data-go="overview">Dashboard</button></div>
  </section>
  <div class="stats"><div class="stat"><b>${list.length}</b><span>Transactions shown</span></div><div class="stat"><b>${units}</b><span>Units sold</span></div><div class="stat"><b>${money(revenue)}</b><span>Revenue shown</span></div></div>
  <div class="panel table-panel wrap">${list.length ? `<table><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total</th></tr>
  ${list.map(s => `<tr><td>${s.date}</td><td>${productIdentity(products.find(p => p.name === s.productName) || {name:s.productName})}</td><td>${s.quantity}</td><td>${money(s.total)}</td></tr>`).join('')}</table>` : '<div class="empty-state">No sales yet. Record your first sale to start building a history.</div>'}</div>`;
}
render();
initialize();
</script>
</body>
